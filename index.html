<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="light dark">
	<meta name="theme-color" content="#f2f0e9" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
	<style id="startup-theme">
		html, body, #app { min-height: 100%; margin: 0; background: #f2f0e9; }
		.startup { display: grid; min-height: 100vh; place-items: center; color: #006699; }
		.startup svg { width: 76px; height: 76px; }
		@media (prefers-color-scheme: dark) {
			html, body, #app { background: #000; }
			.startup { color: #71b8dc; }
		}
	</style>
	<meta name="description" content="Discover the closest Wikidata items around you.">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Nearby WD">
	<link rel="manifest" href="./manifest.webmanifest">
	<link rel="icon" href="./icon.svg" type="image/svg+xml">
	<title>Nearby on Wikidata</title>
</head>
<body>
	<div id="app">
		<div class="startup" aria-label="Loading Nearby on Wikidata">
			<svg viewBox="0 0 64 64" aria-hidden="true">
				<circle cx="32" cy="32" r="18" fill="none" stroke="currentColor" stroke-width="2" opacity=".25"/>
				<circle cx="32" cy="32" r="4" fill="currentColor"/>
				<path d="M32 5v10M32 49v10M5 32h10M49 32h10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
			</svg>
		</div>
	</div>
	<noscript>This app needs JavaScript and location access to find nearby Wikidata items.</noscript>
	<script type="module" src="/src/main.ts"></script>
</body>
</html>
